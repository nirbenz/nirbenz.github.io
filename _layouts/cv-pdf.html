---
common-css:
  - "/assets/css/beautifuljekyll.css"
common-ext-css:
  - href: "https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    sri: "sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
---

<!DOCTYPE html>
<html lang="{{ page.language | default: site.language | default: 'en' }}">
{% include head.html %}

<body>
  <style>
    /* Static instances built by scripts/build_print_fonts.py. Google Fonts
       serves these families as variable fonts, which Chromium's PDF backend
       cannot embed; it falls back to bitmap glyphs and the text looks blurry. */
    @font-face {
      font-family: "Lora";
      font-weight: 400;
      font-style: normal;
      src: url({{ "/assets/fonts/lora-400.woff2" | relative_url }}) format("woff2");
    }
    @font-face {
      font-family: "Lora";
      font-weight: 700;
      font-style: normal;
      src: url({{ "/assets/fonts/lora-700.woff2" | relative_url }}) format("woff2");
    }
    @font-face {
      font-family: "Lora";
      font-weight: 400;
      font-style: italic;
      src: url({{ "/assets/fonts/lora-400-italic.woff2" | relative_url }}) format("woff2");
    }
    @font-face {
      font-family: "Lora";
      font-weight: 700;
      font-style: italic;
      src: url({{ "/assets/fonts/lora-700-italic.woff2" | relative_url }}) format("woff2");
    }
    @font-face {
      font-family: "Open Sans";
      font-weight: 800;
      font-style: normal;
      src: url({{ "/assets/fonts/opensans-800.woff2" | relative_url }}) format("woff2");
    }
    @page {
      size: A4;
      margin: 0.9cm;
    }
    /* Bootstrap's print stylesheet pins the body to 992px and Chromium
       shrinks that layout to fit the printable width, which is what sets
       the text scale of the PDF. A slightly narrower layout makes long
       lines wrap a little earlier. */
    body {
      padding: 0;
      margin: 0;
      min-width: 960px !important;
    }
    #cv-content > *:first-child {
      margin-top: 0;
    }
    /* Pull a role's bullets up under its title instead of leaving the
       theme's full paragraph margin between them. */
    #cv-content p:has(+ ul) {
      margin-bottom: 0.5rem;
    }
    /* Never split an entry (title + bullets, with the headings above it)
       or a single bullet across pages. */
    .cv-entry, li {
      break-inside: avoid;
    }
    h1, h2, h3, h6, hr {
      break-after: avoid;
    }
  </style>

  <div id="cv-content">
    {{ content }}
  </div>

  <script>
    // Group headings with the entry below them, and each title paragraph
    // with the lists that follow it, so a page break never lands inside one.
    const root = document.getElementById("cv-content");
    const isHeading = (el) => /^(H[1-6]|HR)$/.test(el.tagName);
    let group = [];
    for (const el of Array.from(root.children)) {
      group.push(el);
      const next = el.nextElementSibling;
      if (isHeading(el) || (next && next.tagName === "UL")) continue;
      const wrapper = document.createElement("div");
      wrapper.className = "cv-entry";
      group[0].before(wrapper);
      wrapper.append(...group);
      group = [];
    }
  </script>
</body>
</html>
