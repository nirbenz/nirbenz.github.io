name: Render CV PDF
on:
  push:
    branches: [master]
    paths:
      - _includes/nir_ben_zvi_cv.md
      - cv-pdf.md
      - _layouts/cv-pdf.html
      - assets/css/**
      - scripts/render_cv_pdf.py
      - .github/workflows/cv-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: astral-sh/setup-uv@v5
      - name: Install Chromium
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Render PDF
        run: uv run scripts/render_cv_pdf.py
      - name: Commit PDF
        run: |
          git add assets/nir_ben_zvi_cv.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render CV PDF"
          git pull --rebase
          git push
